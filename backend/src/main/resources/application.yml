spring:
  application:
    name: judo-club-constantine-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/judo_club_constantine}
    username: ${DATABASE_USERNAME:judo}
    password: ${DATABASE_PASSWORD:judo}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-before-production}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    cookie-name: ${JWT_COOKIE_NAME:jcc_token}
    secure-cookie: ${JWT_SECURE_COOKIE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    admin-email: ${ADMIN_EMAIL:admin@judoclub.dz}
    admin-password: ${ADMIN_PASSWORD:Admin123!}
