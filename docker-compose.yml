services:
  postgres:
    image: postgres:16-alpine
    container_name: judo-club-constantine-postgres
    environment:
      POSTGRES_DB: judo_club_constantine
      POSTGRES_USER: judo
      POSTGRES_PASSWORD: judo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judo -d judo_club_constantine"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
